# 注释以 `#` 开头。
# 表格第一列为武技/忍具的 UID，不要修改。
# 表格的中间列为武技/忍具的名字，供参考，可删改。
# 武技搓招：↑↓←→=移动；r=鼠标右键(防)；l=鼠标左键(攻)；f=交互；ff=连按f；rl/rf/fr/fl=双键。
# 双键命中后换槽，attack_delay 后再注入 rl 放招。
# 忍具：q=切换忍具；t=使用忍具。
#   - 单键 `t`：全场唯一默认，点按/按住即装备并注入使用。
#   - 双键：首键为 ↑↓←→/r/l/f/**q**（仅 t 不能作首键），尾键为 q 或 t；
#     短窗口内顺序按下 → 装备对应忍具并注入使用；尾键按住则持续注入。
#   例：`↑q`、`↓t`、`qt`。未写键位的忍具行会被忽略。
# 不推荐 l+任意键：由于未知的逻辑冲突，这类键位拥有较高的不触发机率，欢迎提交解决此 bug 的方案。

