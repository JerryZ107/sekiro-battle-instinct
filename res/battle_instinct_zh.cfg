# 注释以 `#` 开头。
# 表格第一列为武技/忍具的 UID，不要修改。
# 表格的中间列为武技/忍具的名字，供参考，可删改。
# 武技搓招：↑↓←→=移动；r=鼠标右键(防)；l=鼠标左键(攻)；e=交互；ee=连按e；rl/re/er/el=双键。
# 双键命中后换槽，attack_delay 后再注入 rl 放招。
# 忍具：q=切换忍具；t=使用忍具。
#   - 单键 `t`：全场唯一默认，点按/按住即装备并注入使用；松开后回默认也回到它。
#   - 单键 `q`：可另绑一个忍具，触发方式与 `t` 相同（装备+注入，按住持续）；不会成为回默认目标。
#   - 双键：首键为 ↑↓←→/r/l/e（有裸 `q` 时不宜再写 `qt`），尾键只能是 q 或 t；
#     短窗口内「首键 → 尾键」顺序按下 → 装备对应忍具并注入使用；尾键按住则持续注入。
#   - 因忍具键与忍具切换键皆有默认忍具，故其不能作为首键，只能作为尾键。
#     且由于防御优先级较高、攻击键容易按出突刺，不建议使用 r/l 为首键。
#   - 因此请写 `↑q` / `→t`，不要写 `q↑`（第二键不能是方向）。
#   例：`↑q`、`↓t`、`q`、`t`。未写键位的忍具行会被忽略。

