# ===================== 纸人（严格规则 + 总开关） =====================
纸人上限功能: 开
# ------------------------------------------------------------------
# 运行时上限固定为：20 + 2 × i
# i = 已学「形代所持上限+1A / +1B / +1C / +1D / +1E」的数量（0~5）。
# DLL 每帧从游戏实时背包读取这 5 个技能的持有状态，学到一个 i 就 +1，
# 同一帧把上限写成 20 + 2 × i；不读 state 文件，也不按旧上限增量猜。
# 下面两个数只给启动阶段自动 param 补丁用，DLL 的运行时上限不受它们影响。
纸人初始上限: 20
技能增加上限: 2
纸人漂流: 9
# 纸人漂流 = 血纸人(临时纸人)的上限，也是纸人漂流一次给的数量
# 关掉「纸人上限功能」则完全不修正（也不写任何内存）

# ===================== 心流（完美弹反叠层） =====================
心流功能: 开
心流持续时间: 3s
心流最大层数: 10
心流回复比例: 20,30,40,50,60,70,80,90,100,110
# 心流调试日志: 关
# ------------------------------------------------------------------
# 每次完美弹反 +1 层，并刷新 3 秒计时；10 层后不再增加，只刷新计时。
# 心流比例是本次架势上涨的总处理比例，不是无条件回复：
#   <100%：只减免本次架势上涨，不产生实际回复；
#   =100%：完全抵消本次架势上涨；
#   >100%：先抵消 100%，只有超出的部分才实际回复架势。
# 第 1~10 层分别为 20%~110%（每层 +10%）。
# 非完美受击或普通格挡清 0；3 秒内没有再次完美弹反清 0。
# 完美弹反判定（实测游戏处理后的 DamageInfo 标志）：
#   防御/弹反反应：info_164 != 0
#   完美弹反：info_231 & 0x40 != 0，且本次没有掉血。
# 普通格挡：有防御反应但 info_231 & 0x40 == 0。
# 输入时序不作为判定依据（会误判普通格挡）。
# 心流回复比例固定对应 1~10 层；填少会沿用最后一项。


