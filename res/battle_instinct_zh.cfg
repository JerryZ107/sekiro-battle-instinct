# ui language: zh
# 游戏内键位配置界面语言：zh 或 en。
# 注释以 `#` 开头。
# 表格第一列为武技/忍具的 UID，不要修改。
# 表格的中间列为武技/忍具的名字，供参考，可删改。
# 武技搓招：↑↓←→=移动；r=鼠标右键(防)；l=鼠标左键(攻)；e=交互；f=钩锁；ee/ef/fe/ff=连按；rl/re/er/el=双键。
#   e=交互、f=钩锁，均跟随游戏内动作位（改键/手柄可用）。
# 同一行可用 `/` 绑定多个键位，如 `↓l/l↓` 表示两种搓法出同一武技。
# 双键命中后换槽，attack_delay 后再注入 rl 放招。
# 名称含「瞬发」的行：持防+方向边沿立刻出招（如 r↓），不走双键延迟。
# 忍具：q=切换忍具；t=使用忍具。
#   - 单键 `t`：全场唯一默认，点按/按住即装备并注入使用；松开后回默认也回到它。
#   - 单键 `q`：可另绑一个忍具，触发方式与 `t` 相同（装备+注入，按住持续）；不会成为回默认目标。
#   - 双键：首键为 ↑↓←→/r/l/e/f（有裸 `q` 时不宜再写 `qt`），尾键为 q/t，或 r/l/e/f；
#     短窗口内「首键 → 尾键」顺序按下 → 装备对应忍具并注入使用；尾键按住则持续注入。
#     例：`↑q`、`↓t`、`↑r`、`→l`、`↓e`、`↑f`。尾键为 r/l/e/f 时，同帧不会再触发同键武技。
#   - 因忍具键与忍具切换键皆有默认忍具，故 q/t 不能作为首键（有裸绑定时），只能作为尾键。
#     且由于防御优先级较高、攻击键容易按出突刺，不建议用 r/l 为首键；作尾键时也请避开已占用的武技键位。
#   - 因此请写 `↑q` / `→t` / `↑r`，不要写 `q↑`（第二键不能是方向）。
#   - 忍具键位后加 `-时间` 可修改多段触发时限，如 `↑q-0.5s` 或 `↑q-多段触发时限0.5s`；未写则默认 1s。
#   例：`↑q`、`↓t`、`↑r`、`q`、`t`。未写键位的忍具行会被忽略。

# 钩子会在游戏代码就绪后自动安装，通常无需额外等待
# 同一键位拥有多个技能时可能会导致游戏启动时间较长/无法启动，请在修改后仔细检查

