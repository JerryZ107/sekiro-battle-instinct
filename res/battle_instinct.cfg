# =================== Paper dolls (strict rule + master switch) ===================
paper cap fix: on
# ---------------------------------------------------------------------------
# Runtime cap is fixed at: 20 + 2 * i
# i = number of learned "form cap" skills A/B/C/D/E (SkillParam 75/76/175/176/603).
# The DLL reads the five live inventory entries every frame; learning one bumps i
# and the cap is rewritten in the same frame.  No state file, no old-cap inference.
# The two numbers below are only used by the automatic startup param patcher;
# the DLL's runtime cap does NOT use them.
paper initial cap: 20
per skill bonus: 2
drift: 9
# drift = blood/temporary emblem cap, and the amount granted per use of the Paper Doll Drift item
# turn "paper cap fix" off to disable the whole feature (no memory writes at all)

# ===================== Flow (perfect-deflect stacking) =====================
flow: on
flow duration: 3s
flow max stacks: 10
flow refund ratios: 20,30,40,50,60,70,80,90,100,110
# flow debug log: off
# ---------------------------------------------------------------------------
# Each perfect deflect adds one stack and refreshes the 3s timer. At 10 stacks
# the stack count stays capped, but the timer is still refreshed.
# The flow ratio is the total handling percentage for that deflect's posture
# increase, not unconditional healing:
#   <100%: only mitigate this posture increase;
#   =100%: fully cancel it;
#   >100%: cancel 100%, and only the excess actually restores posture.
# Stacks 1..10 use 20%..110% (+10% per stack). A non-perfect hit or normal
# block clears all stacks. No perfect deflect within 3s clears all stacks.
# Perfect deflect detection (verified game DamageInfo flags):
#   guard/deflect reaction: info_164 != 0
#   perfect deflect:        info_231 & 0x40 != 0 and no HP damage.
#   normal block:           guard reaction with info_231 & 0x40 == 0.
# Input timing is not used for detection (it misclassified normal blocks).

# ===================== Paper-doll damage reduction =====================
# Tier is based on raw HP damage / max HP; temporary emblems are spent first.
# Tier 1  0-33%:  spend 1, reduce 60%
# Tier 2 33-66%:  spend 2, reduce 60%; with only 1, spend 1 and reduce 30%
# Tier 3 66-100%: spend 3, reduce 60%; with 2, spend 2 and reduce 30%; with 1, spend 1 and reduce 20%
# With 0 emblems there is no reduction.
paper guard: on
paper guard debug: off
