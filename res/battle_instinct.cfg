# Comments start with #.
# Combat arts: arrows=move; r=right mouse(block); l=left mouse(attack); e=interact;
#   ee=double e; rl/re/er/el=two buttons. After match: set_slot then inject rl after attack_delay.
#   Use `/` for multiple binds on one line, e.g. `↓l/l↓` = two combos for the same art.
# Prosthetic tools: q=switch prosthetic; t=use prosthetic.
#   - bare `t`: unique default — equip + inject use (hold to sustain); return-default target.
#   - bare `q`: optional second one-shot bind — same fire style as `t`; not return-default.
#   - two-key: first is ↑↓←→/r/l/e (avoid `qt` if bare `q` is set); tail must be q or t
#     (directions cannot be the second key). Within a short window: first→tail arms that tool
#     and injects use while the tail is held.
#   - Because both use (t) and switch (q) have default tools, they cannot be first keys —
#     only tails. Also avoid r/l as first: block has high priority; attack easily thrusts.
#   - Prefer ↑q / →t; never write q↑.
#   - Append `-time` after a bind to set multi-hit lock, e.g. `↑q-0.5s` or `↑q-multi-hit0.5s`; default 1s if omitted.
#   Examples: ↑q, ↓t, q, t. Lines without a bind token are ignored.

# First launch may take a while; the mod hooks input ~10s after entering the game.
# Duplicate binds on the same keys can slow or break startup — double-check after edits.

