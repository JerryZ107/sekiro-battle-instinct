# Comments start with #.
# Combat arts: arrows=move; r=right mouse(block); l=left mouse(attack); f=interact;
#   ff=double f; rl/rf/fr/fl=two buttons. After match: set_slot then inject rl after attack_delay.
# Prosthetic tools: q=switch prosthetic; t=use prosthetic.
#   - bare `t`: unique default — equip + inject use (hold to sustain).
#   - two-key: first is ↑↓←→/r/l/f/q (only t cannot be first); tail must be q or t
#     (directions cannot be the second key). Within a short window: first→tail arms that tool
#     and injects use while the tail is held.
#   - Why this shape: with q/t fixed as the tail, even if you fat-finger use/switch first,
#     finishing the intended first+tail still locks the correct tool (e.g. for ↑q, a stray q
#     is fine — press ↑ then q again). Prefer ↑q / qt; never write q↑.
#   Examples: ↑q, ↓t, qt. Lines without a bind token are ignored.
# Not recommended: l+any (attack-first pairs). Unknown conflicts cause a high miss rate; PRs welcome.

